    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      (function () {
        var scripts = document.getElementsByTagName('script');
        var isRawSourceBranch = false;
        for (var i = 0; i < scripts.length; i++) {
          var src = scripts[i].getAttribute('src') || '';
          if (src.indexOf('src/main.tsx') !== -1) {
            isRawSourceBranch = true;
            break;
          }
        }
        if (isRawSourceBranch && window.location.hostname.indexOf('github.io') !== -1) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './public/gh-pages-bundle/app.css';
          document.head.appendChild(link);

          var s = document.createElement('script');
          s.type = 'module';
          s.src = './public/gh-pages-bundle/app.js';
          document.body.appendChild(s);
        }
      })();
    </script>
  </body>
</html>
